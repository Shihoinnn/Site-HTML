<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyCdiCPp-_Z29sVadMha6oOcAVJQf4t6dUA",
authDomain: "chatbiblioteca-61a76.firebaseapp.com",
projectId: "chatbiblioteca-61a76",
storageBucket: "chatbiblioteca-61a76.firebasestorage.app",
messagingSenderId: "691783556697",
appId: "1:691783556697:web:7fc6354306b73ee4865b48"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const form = document.getElementById("chatForm");

form.addEventListener("submit", function(e){

e.preventDefault();

const nome = document.getElementById("nome").value;
const mensagem = document.getElementById("mensagem").value;

db.collection("mensagens").add({
nome: nome,
mensagem: mensagem,
data: new Date()
});

form.reset();

});
db.collection("mensagens")
.orderBy("data")
.onSnapshot(snapshot => {

chat.innerHTML = "";

snapshot.forEach(doc => {

const data = doc.data();

const msg = document.createElement("div");
msg.className = "message";

msg.textContent = data.nome + ": " + data.mensagem;

chat.appendChild(msg);

});

});

</script>
