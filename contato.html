<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8" content="width=device-width, initial-scale=1.0">
<title>Contato</title>
<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
</head>

<body>

<nav>
<a href="index.html">Início</a>
<a href="jogos.html">Livros</a>
<a href="desenvolvedores.html">Autores</a>

</nav>

<section>

<h2>Contato</h2>

<p>Quer sugerir um livro? Envie uma mensagem!</p>

<div id="chat" class="chat-box"></div>

<form id="chatForm">

<input type="text" id="nome" placeholder="Seu nome" required>
<br>

<textarea id="mensagem" placeholder="Sua mensagem" rows="4"></textarea>
<br>

<button type="submit">Enviar</button>

</form>

</section>

<footer>
<p>📖 Biblioteca Virtual</p>
</footer>

<script>

const firebaseConfig = {
apiKey: "AIzaSyCdiCPp-_Z29sVadMha6oOcAVJQf4t6dUA",
  authDomain: "chatbiblioteca-61a76.firebaseapp.com",
  projectId: "chatbiblioteca-61a76",
  storageBucket: "chatbiblioteca-61a76.firebasestorage.app",
  messagingSenderId: "691783556697",
  appId: "1:691783556697:web:7fc6354306b73ee4865b48",
  measurementId: "G-K621ZJD0B9"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

const form = document.getElementById("chatForm");
const chat = document.getElementById("chat");

form.addEventListener("submit", function(e){

e.preventDefault();

const nome = document.getElementById("nome").value;
const mensagem = document.getElementById("mensagem").value;

db.collection("mensagens").add({
nome: nome,
mensagem: mensagem,
data: firebase.firestore.FieldValue.serverTimestamp()
});

form.reset();

});

db.collection("mensagens")
.orderBy("data")
.onSnapshot(snapshot => {

chat.innerHTML = "";

snapshot.forEach(doc => {

const data = doc.data();

const msg = document.createElement("div");
msg.className = "message";

msg.textContent = data.nome + ": " + data.mensagem;

chat.appendChild(msg);

});

});

</script>

</body>
</html>
